[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "citywheels-help-desk"
version = "0.1.0"
description = "Command-line AI help desk agent for the CityWheels bike rental shop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0,<2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
citywheels = "citywheels.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
